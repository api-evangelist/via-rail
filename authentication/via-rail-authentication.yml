summary:
  types: [none]
  api_key_in: []
  oauth2_flows: []
  note: >-
    The one API surface VIA Rail publishes requires no authentication at all -
    no account, no registration form, no API key, no click-through and no rate
    limit. That is a positive, deliberate and documented posture, not a gap: the
    Developer Resources page hands over a complete national rail timetable to an
    anonymous HTTP GET, and the only obligation attached is the OGL-Canada 2.0
    attribution requirement, accepted by the act of downloading.
