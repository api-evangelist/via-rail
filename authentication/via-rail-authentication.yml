undocumented_surfaces:
  - name: reservation platform gateway
    host: https://api.reservia.viarail.ca
    documented: false
    observed_behaviour: >-
      Every path returns HTTP 403 with the 42-byte AWS API Gateway body
      {"message":"Missing Authentication Token"} - including every /.well-known/
      path. Nothing can be read anonymously.
    observed_scheme: >-
      The reservia.viarail.ca production Angular bundle declares an
      s3Passenger.grantTypes map of Sqills S3 Passenger OAuth grant-type URNs -
      https://com.sqills.s3.oauth.public, https://com.sqills.s3.oauth.booking
      and https://com.sqills.s3.oauth.agent - alongside refresh_token and
      urn:ietf:params:oauth:grant-type:token-exchange (RFC 8693). This is
      evidence of the vendor platform's OAuth machinery, NOT a published VIA
      Rail authentication contract: there is no authorization-server metadata
      document, no documented scopes, no client registration path and no terms
      of use. It is recorded here so a later round does not mistake it for a
      published scheme, and it is the reason no scopes/ artifact is emitted.
  - name: VIA Rail Tracker data feed
    host: https://tsimobile.viarail.ca/data/allData.json
    documented: false
    observed_behaviour: >-
      HTTP 200, ~242 KB of live train positions and bilingual alerts, entirely
      unauthenticated. Undocumented, unlicensed, unschema'd; not offered as an
      API and excluded from apis.yml.
human_access_gates:
  note: >-
    Authentication for the commercial channel is human, not machine. Travel
    agencies sign in at https://reservia.viarail.ca/en/booking/agent/login and
    business partners at .../contra/login, both Angular sign-ins with Google
    reCAPTCHA. Enrolment is out-of-band: an agency must hold and register an
    agency IATA number and be approved individually or under a preferred
    partner agreement; a tour operator must commit to CAD $25,000/year minimum
    revenue and is issued a proprietary 8-digit account number. There is no
    machine credential to obtain at any price.
