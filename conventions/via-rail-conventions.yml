  lifecycle: lifecycle/via-rail-lifecycle.yml
  conformance: conformance/via-rail-conformance.yml
  data_model: data-model/via-rail-data-model.yml
  json_schema: json-schema/via-rail-gtfs-schema.json
  well_known: well-known/via-rail-well-known.yml
  domain_security: security/via-rail-domain-security.yml
