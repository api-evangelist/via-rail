aid: via-rail
name: VIA Rail Canada
review:
  question: >-
    Does VIA Rail Canada publish any public or partner API, and what would it
    cost a customer of VIA Rail to leave?
  answer: partial
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: rail-ground
  homeMarket: Canada
  primaryDomain: viarail.ca
findings:
  summary: |
    VIA Rail Canada publishes exactly one machine-readable contract, and it is
    an open standard. https://www.viarail.ca/en/developer-resources is a real,
    live, ungated Developer Resources page — no login, no registration, no API
    key, no rate limit — offering a static GTFS archive at
    https://www.viarail.ca/sites/all/files/gtfs/viarail.zip and a contact
    address of dev@viarail.ca. The page states: "VIA Rail has schedules
    published in the General Transit Feed Specification (GTFS) format available
    for developers. By downloading our GTFS data, you agree to be bound to the
    Open Government Licence – Canada version 2." The 2026-07-09 edition was
    harvested, parses cleanly, and holds 19 routes, 388 stations, 85 trips,
    1,577 stop times and 86,116 shape points over a 20260709-20261107 service
    window.

    Everything transactional is unpublished. There is no REST API, no OpenAPI,
    no AsyncAPI, no GraphQL, no NDC, no OSDM and no GDS channel. The
    developer., developers., api., apis., docs. and cdn. subdomains of
    viarail.ca are all NXDOMAIN. Every well-known spec path on www.viarail.ca
    returns 404.

    The reservation platform is now visible even though it is not documented.
    The reservia.viarail.ca Angular bundle carries an explicit
    `apiGateway.baseUrl` of "https://api.{{env}}tst.reservia.viarail.ca" and an
    `s3Passenger.grantTypes` map of Sqills OAuth grant-type URNs
    (https://com.sqills.s3.oauth.public, .booking, .agent) alongside RFC 8693
    token exchange. A leftover test fixture points at
    https://api.viarail-dev-cgi-test.cloud.sqills.com/api/v1/meta/stations —
    a host that now NXDOMAINs, but whose name identifies the integrator (CGI)
    and the vendor (Sqills). The production gateway api.reservia.viarail.ca
    resolves and answers 403 {"message":"Missing Authentication Token"}. The
    booking front end reads `_u_i_c_station_code` off every segment, which is
    the UIC station-code field of the Sqills S3 Passenger data model. So VIA
    Rail runs a European rail PSS on a Canadian network, and publishes not one
    line of its contract.

    That is the whole shape of the finding: VIA Rail is unusually generous with
    schedule data and completely closed on inventory. A developer can build a
    trip planner against VIA in an afternoon and can never sell a VIA ticket.
  consumerSurface:
    documented: partial
    note: >-
      Schedules are documented and downloadable as GTFS. Live train positions
      are served, undocumented, from https://tsimobile.viarail.ca/data/allData.json
      behind the public VIA Rail Tracker at https://tsimobile.viarail.ca/.
      Booking, check-in, seat selection, servicing and the VIA Préférence
      loyalty programme are delivered only through viarail.ca, reservia.viarail.ca,
      viapreference.com, the VIA Rail mobile app and the call centre. No public
      consumer booking API is documented.
  distributionSurface:
    documented: false
    channels:
      - name: Direct (web, mobile app, call centre)
        evidence: >-
          reservia.viarail.ca is VIA's own Sqills-backed booking engine;
          agency.txt in the GTFS names https://reservia.viarail.ca/ as the
          agency_fare_url and ticketing_deep_links.txt gives
          https://reservia.viarail.ca/google-results as the single deep link.
      - name: Travel Agency Portal
        evidence: >-
          https://reservia.viarail.ca/en/booking/agent/login — a human web
          sign-in only. The travel-agent FAQ states an agency must "be approved
          as an individual agency or registered under a preferred partner
          agreement" and that "your agency IATA number is registered", after
          which an administrator is identified and individual agents register
          under that IATA number. No API, no documentation.
      - name: Tour Operator Portal
        evidence: >-
          Same reservia sign-in. The tour-operator FAQ requires operators to
          "demonstrate a plan to earn and maintain a minimum revenue of
          $25,000/year and combine rail tickets with other tour components in
          travel packages", states "VIA Rail tickets must not be sold on their
          own and outside of packaged travel", and issues "a unique 8-digit
          account number".
      - name: Business partners (contra)
        evidence: >-
          https://reservia.viarail.ca/en/booking/contra/login, linked from the
          site footer as "Business partners". Login only; nothing published
          about what a business partner is or how one is appointed.
      - name: GDS
        evidence: >-
          None found. Sabre, Amadeus, Travelport and GDS are not mentioned on
          any VIA Rail travel-agent, tour-operator or corporate page probed.
      - name: NDC / OSDM
        evidence: >-
          None found. IATA NDC is not applicable to a rail operator and is
          absent from every page probed. The rail analogue, the UIC Open Sales
          and Distribution Model (OSDM, https://osdm.io/, 200), is also never
          referenced by VIA Rail — even though its PSS front end carries UIC
          station codes.
