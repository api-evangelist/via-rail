actions:
  openapiHarvested: false
  specsCount: 0
  gtfsHarvested: true
  gtfsPath: gtfs/viarail-gtfs.zip
  apisListed: 1
  reason: >-
    No OpenAPI, AsyncAPI, GraphQL schema or Postman collection exists anywhere
    on VIA Rail's estate, so the openapi/ directory is deliberately absent
    rather than empty. One real machine-readable contract was found and
    harvested verbatim — the GTFS schedule feed — and it is the single entry in
    apis[]. The two live undocumented surfaces (api.reservia.viarail.ca and
    tsimobile.viarail.ca/data/allData.json) are recorded in
    observedButUndocumented and excluded from apis.yml, because neither has a
    published contract, licence or terms of use.
