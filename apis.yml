apis:
  - aid: via-rail:via-rail-gtfs-schedule-feed
    name: VIA Rail GTFS Schedule Feed
    description: >-
      VIA Rail's complete national timetable published as a static General
      Transit Feed Specification (GTFS) archive, offered for download from the
      VIA Rail Developer Resources page with no registration, no API key and no
      rate limit. The July 9th 2026 edition covers a 20260709-20261107 service
      window and carries 19 routes, 388 stations, 85 trips, 1,577 stop times
      and 86,116 shape points, plus the GTFS ticketing extension files
      ticketing_identifiers.txt and ticketing_deep_links.txt that map each stop
      to a four-letter VIA station mnemonic and each trip to a VIA train number.
      Downloading the file binds the consumer to the Open Government Licence -
      Canada version 2.0, which permits copying, modification, distribution and
      commercial use for any lawful purpose subject to attribution. This is the
      only machine-readable contract VIA Rail publishes.
    humanURL: https://www.viarail.ca/en/developer-resources
    baseURL: https://www.viarail.ca/sites/all/files/gtfs/viarail.zip
    tags:
      - GTFS
      - Schedules
      - Timetables
      - Transit
      - Open Data
      - Rail
    properties:
      - type: Documentation
        url: https://www.viarail.ca/en/developer-resources
      - type: GTFS
        url: gtfs/viarail-gtfs.zip
      - type: Download
        url: https://www.viarail.ca/sites/all/files/gtfs/viarail.zip
      - type: License
        url: https://open.canada.ca/en/open-government-licence-canada
      - type: Specification
        url: https://github.com/google/transit/blob/master/gtfs/spec/en/reference.md
      - type: Email
        url: mailto:dev@viarail.ca
      - type: JSONSchema
        url: json-schema/via-rail-gtfs-schema.json
      - type: DataModel
        url: data-model/via-rail-data-model.yml
