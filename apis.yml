description: >-
  VIA Rail Canada Inc. is the federal Crown corporation that operates Canada's
  national intercity passenger rail network, headquartered in Montreal and
  reporting to Parliament through the Minister of Transport. It runs the
  Quebec City - Windsor corridor plus long-distance and regional services
  including The Canadian (Toronto - Vancouver), The Ocean (Montreal - Halifax),
  Winnipeg - Churchill, Jasper - Prince Rupert, Sudbury - White River, and the
  jointly operated Toronto - New York Maple Leaf. In the distribution chain
  VIA Rail is a direct-only supplier: it sells through viarail.ca, its mobile
  app, its call centre, and its own Travel Agency and Tour Operator portals on
  reservia.viarail.ca. There is no GDS channel, no NDC, no OSDM, and no
  reseller API. VIA Rail's API posture is honestly stated as an open-standard
  data feed and nothing else. It publishes a real, ungated Developer Resources
  page offering a static GTFS schedule feed licensed under the Open Government
  Licence - Canada 2.0, with a dev@viarail.ca contact address - one of the very
  few genuinely self-serve, commercially reusable machine-readable contracts
  in Canadian travel. Everything transactional is unpublished: the reservation
  platform is Sqills S3 Passenger integrated by CGI, its API gateway at
  api.reservia.viarail.ca answers 403 "Missing Authentication Token" with no
  documentation, no terms and no published contract, and agency access is
  gated behind approval plus a registered IATA number, while tour operators
  must commit to a CAD $25,000 per year minimum revenue and may not sell VIA
  tickets outside packaged travel.
